# [TrackC] btagtrig 모드 — b-tag/trigger SF 유도용 skim (MC+Data)
# ============================================================================
# [TrackC] 간소화된 submit yml — 샘플은 "이름만", weight는 런타임 합성
# ----------------------------------------------------------------------------
#   - weight: xsec_db(cross_section_pb × br) × lumi / Σgenw(prescan runs.genEventSumw)
#   - filelist: 규칙 'filelist_<sample_name>.txt'
#   - data_or_mc: xsec_db의 cross_section_pb null 여부로 자동 판정
# 기존 형식(- filelist:/weight: 명시)도 그대로 호환됨 (override).
# ============================================================================
common:
  year: "2017"
  analysis_mode: btagtrig
  lumi_fb_inv: 41.48
  xsec_db: "data/samples_2017UL.json"            # ★ cross section 단일 소스 (The Barn)
  prescan: "prescan_summary/prescan_summary.json" # ★ Σgenw 소스 (runs.genEventSumw)
  files_per_job: 1
  # [STEP18] 보정 입력 경로 정책 (코드 default 폐기 — ConfigPath.h / submitter 동일 계약):
  #   "" (빈 값)/키 누락 -> FATAL E12 (더 이상 'default 사용' 신호 아님)
  #   null               -> 선택 보정 비활성(그 보정 없이 동작); 필수 경로면 FATAL E13
  #   "<경로>"           -> 사용 (로드 실패 시 해당 subsystem FATAL: 40/41/50/51/60-63/70-73)
  # 필수: path_jsonpog(항상, JME/PU), path_goldenjson(Data). 나머지는 선택.
  # 아래 trigsf/btagrw/stitch/expttid 는 신규 dataset(ttHH2017UL_fullNano_v20)용으로
  # 아직 미생성 -> null(비활성). 주의: main/debug + (--trigsf on / --btagrw on) 이면
  # 해당 경로가 필수가 되어 null 이 E13 -> 재유도 전에는 그 SF 토글을 off 로 둘 것.
  path_jsonpog: "/cvmfs/cms.cern.ch/rsync/cms-nanoAOD/jsonpog-integration"
  path_goldenjson: "/u/user/jhlee/ttHH/CMSSW_14_2_1/src/tempTTHH/GoldenJson"   # OPEN: 환경별 절대경로 확인
  path_trigsf_dir: null               # DISABLED (신규 dataset trigger SF 미유도)
  path_btag_reweight_json: null       # DISABLED (_skipBtagReweight; tt+nb key JSON 미재생성)
  path_stitch_json: null              # DISABLED (신규 dataset stitch factors 미유도)
  path_expanded_ttbarid_dir: null     # DISABLED (신규 dataset ttnb_<sample>.root 미생성)
# [STEP17] 신규 dataset(ttHH2017UL_fullNano_v20) 반영. 주의:
#   - main/btagtrig 는 각 샘플이 (a) xsec_db(samples_2017UL.json) 등록 +
#     (b) prescan_summary(runs.genEventSumw) 존재해야 동작 (없으면 FATAL).
#     => 신규 샘플은 prescan 먼저 돌린 뒤 사용할 것.
#   - xsec_db 의 'verify_xsec':true 값은 표준 참고값 — XSDB/GenXSecAnalyzer 로 확정 필요.
# [STEP18] Sample 이름 = NtupleForge campaign config(campaign_ttHH2017UL_fullNano_v20) 기준.
#   main/btagtrig 는 각 샘플이 xsec_db(data/samples_2017UL.json) 등록 + prescan_summary 존재해야 동작
#   (없으면 FATAL). 신규 dataset 은 prescan 먼저 실행할 것.
