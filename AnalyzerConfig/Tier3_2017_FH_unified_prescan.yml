  - tHW
  # ── tt+jets inclusive (5FS, stitching anchor) ──
  - TTbar_Hadronic
  - TTbar_SemiLep
  - TTbar_DiLep
  # ── tt+bb (4FS) dedicated ──
  - TTbb_Hadronic
  - TTbb_SemiLep
  - TTbb_DiLep
  # ── tt+4b dedicated (LO madgraph) ──
  - TT4b
  # ── ttV ──
  - TTZToBB
  - TTWJetsToQQ
  - TTWJetsToLNu
  - TTZToLLNuNu
  # ── ttVV / ttVH / multi-top ──
  - TTTT
  - TTTW
