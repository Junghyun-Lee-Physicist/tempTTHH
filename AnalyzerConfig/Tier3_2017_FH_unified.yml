common:
  year: "2017"
  # You can choose one of below analysis mode
  # main, btagsf, trigsf
  analysis_mode: "main" 

samples:
  # ---------------------------------------------------------
  # Data (Weight = 1.0)
  # ---------------------------------------------------------
  - filelist: "filelist_SingleMuon_B.txt"
    output_dir: "SingleMuon_B"
    weight: 1.0
    data_or_mc: "Data"
    sample_name: "SingleMuon_B"
    era: "B"
  - filelist: "filelist_JetHT_C.txt"
    output_dir: "JetHT_C"
    weight: 1.0
    data_or_mc: "Data"
    sample_name: "JetHT_C"
    era: "C"

  # ---------------------------------------------------------
  # MC Samples (Updated Weights using Sum(Runs.genEventSumw))
  # Formula: (Xsec * Lumi) / Sum(Runs.genEventSumw)
  # ---------------------------------------------------------
  - filelist: "filelist_ttHH.txt"
    output_dir: "ttHH"
    weight: 0.00000109763773
    data_or_mc: "MC"
    sample_name: "ttHH"
    era: ""
  - filelist: "filelist_QCD_HT2000toInf.txt"
    output_dir: "QCD_HT2000toInf"
    weight: 0.1606282808
    data_or_mc: "MC"
    sample_name: "QCD_HT2000toInf"
    era: ""
  - filelist: "filelist_ttbb.txt"
    output_dir: "ttbb"
    weight: 0.0005295497645
    data_or_mc: "MC"
    sample_name: "ttbb"
    era: ""
