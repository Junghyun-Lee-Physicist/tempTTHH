# [STEP 24] 2024 main -- the FH first look (D-2026-10-05-A): no trigger SF, no b-tag SF, provisional sigma
# ============================================================================
# weight = lumi x cross_section_fb x br / runs.genEventSumw (data/samples_2024.json, prescan_summary_2024/)
#   python3 submit_job_FH_Tier3_unified.py --mode main --config AnalyzerConfig/Tier3_2024_FH_unified_main.yml --trigsf off --btagsf off --btagrw off --preflight
# Output: .../AnalyzerOutput_main_notrig_2024/ (region and SF tags as for 2017, then the year).
# --btagsf on is refused for 2024 (no shape SF, PLAN 9.6 D10; analyzer E11, preflight FAIL).
# ============================================================================
common:
  year: "2024"
  analysis_mode: main
  # 2024 C-I, normtag_PHYSICS, golden JSON 2026-08-04 (PLAN 9.6 D14, docs/DECISIONS.md D-2026-10-05-A)
  lumi_fb_inv: 109.816
  xsec_db: "data/samples_2024.json"                          # PROVISIONAL 13.6 TeV cross sections (D-2026-10-05-A)
  prescan: "prescan_summary_2024/prescan_summary.json"       # consolidate_prescan.py --outdir prescan_summary_2024
  # MC: 10 files per job (one branch set per MC dataset). Data: 1 -- 2024 era C files differ in their HLT
  # branches and a job of several files stops (E11, requireSameBranchSet_; the submitter refuses > 1 for 2024
  # Data). --report/--resubmit read these values, so do not give --files-per-job. 1,939 MC + 3,352 Data jobs.
  files_per_job: 10
  files_per_job_data: 1
  # [STEP18] path policy: "" / missing -> E12; null -> optional correction off (required -> E13); "<path>" -> used
  path_jsonpog: "/cvmfs/cms.cern.ch/rsync/cms-nanoAOD/jsonpog-integration"
  path_goldenjson: "/u/user/jhlee/ttHH/CMSSW_14_2_1/src/tempTTHH/GoldenJson"
  # [STEP 24] our 2024 PU weights (jsonpog has no POG/LUM 2024; tools/stage2/pu_weights.py, D-2026-10-05-A);
  #   read by every 2024 job (Data too: CorrectionsManager loads it for the year)
  path_pu_json: "/u/user/jhlee/ttHH/CMSSW_14_2_1/src/tempTTHH/DerivedCorr/PU/2024_Summer24/puWeights_2024.json"
  path_trigsf_dir: null               # no 2024 trigger SF yet (first look: --trigsf off)
  path_btag_reweight_json: null       # no 2024 b-tag norm reweight
  path_stitch_json: null              # no 2024 stitch factors (D-2026-10-05-C: the 4FS tt+bb / tt4b are not stacked)
  path_expanded_ttbarid_dir: null     # no 2024 tt+nb lookup: tt+>=3b stays in 51-55 (D-2026-10-02-A, D-2026-10-05-C)
