# config.yaml
# Trigger SF Analysis Configuration
#
# Notes:
# - This file is parsed as a simple "key: value" config.
# - Values after '#' are treated as comments and ignored.

# -----------------------------------------------------------------------------
# Flags (true / false)
# -----------------------------------------------------------------------------
# UseNBjets:
#   - true  -> include nb-jet categories (NB_Bins) in histogram/map keys
#   - false -> run with inclusive nb-jet category only ("nB_Inc")
UseNBjets: false

# UseEta:
#   - true  -> include eta categories (Eta_Bins) in histogram/map keys
#   - false -> run with inclusive eta category only ("Eta_Inc")
UseEta: true

# -----------------------------------------------------------------------------
# Binning Definitions (edges)
# -----------------------------------------------------------------------------
# HT_Bins [GeV]
# - Histogram bin edges for HT.
# - If edges = [a, b, c], then bins are [a,b) and [b,c).
HT_Bins: [500.0, 600.0, 700.0, 800.0, 1000.0, 1300.0, 2500.0]

# PT_Bins [GeV]
# - Histogram bin edges for the pT variable (e.g., 6th jet pT).
PT_Bins: [40.0, 45.0, 50.0, 60.0, 70.0, 90.0, 150.0]

# Eta_Bins (signed)
# - Histogram bin edges for eta (signed, not |eta|).
# - Labels are auto-generated, e.g.:
#     [-2.4, -1.2) -> "Eta_m2p4_to_m1p2"
#     [ 0.0,  1.2) -> "Eta_0p0_to_1p2"
Eta_Bins: [-2.4, -1.2, 0.0, 1.2, 2.4]

# NB_Bins (integer thresholds)
# - Threshold list for nb-jet categories (not histogram edges).
# - Example: [3, 4, 5] produces labels:
#     nB3  (exactly 3)
#     nB4  (exactly 4)
#     nB5p (5 or more; overflow category)
NB_Bins: [3, 4, 5]

